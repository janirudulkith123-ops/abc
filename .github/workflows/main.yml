name: Node.js CI/CD Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger the bot execution

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # Recommended engine variant for ASITHA-MD V6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start application
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
          # Add extra secrets below if your configuration requires them (e.g., MONGODB_URI)
        run: npm start
